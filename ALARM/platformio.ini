; ESP32 alarm: reads /api/epp from the Pi and drives the buzzer, LEDs, servo and LCD.
; WiFi credentials: copy src/secrets.example.h to src/secrets.h (git-ignored).

[env:esp32dev]
platform = espressif32 @ 8.0.0  ; Arduino core 3.3: pinned so every computer builds the same firmware
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  madhephaestus/ESP32Servo
  arduino-libraries/LiquidCrystal
  bblanchon/ArduinoJson @ ^7
