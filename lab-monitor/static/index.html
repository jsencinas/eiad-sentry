<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Laboratorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfe9ec;--panel:#f5f9fb;--card:#fff;--ink:#18212f;--muted:#7b8794;--blue:#4aa8ff;--green:#2fbf7f;--red:#ff4d5e}
*,*::before,*::after{box-sizing:border-box;margin:0;font-family:Montserrat,system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding:24px;display:flex;justify-content:center;align-items:flex-start}
button,input{font-family:Montserrat,system-ui,sans-serif;font-size:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.main{width:100%;max-width:1000px;background:var(--panel);border-radius:28px;padding:26px;box-shadow:0 10px 30px #4a7a8026}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.pill{border:1.5px solid var(--green);color:var(--green);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600;background:#fff}
.pill.off{border-color:var(--muted);color:var(--muted)}
.pill.alert{border-color:var(--red);color:var(--red)}

.grid{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:14px}
.grid+.grid{margin-top:14px}
.tile{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;font-weight:600;font-size:14px;box-shadow:0 6px 18px #4a7a8018;width:100%}
.tile .ico{font-size:34px}
button.tile:hover{transform:translateY(-2px);transition:transform .15s}
.power{min-height:260px}
.power .ico{font-size:52px;color:var(--green)}
.power.off .ico{color:var(--muted);filter:grayscale(1)}

.cam{position:relative;background:#000;border-radius:22px;overflow:hidden;min-height:260px;aspect-ratio:4/3;max-height:420px;color:#c5ccd3}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:14px;padding:16px;text-align:center}
.cam .ph span{font-size:46px}
.cam .count{position:absolute;left:14px;bottom:12px;font-weight:600;color:#fff;background:#0009;border-radius:99px;padding:4px 12px;font-size:13px}
.cam .warn{position:absolute;right:14px;bottom:12px;font-size:18px;opacity:.35}
.cam.alert .warn{opacity:1}
.cam.dim img{opacity:.15}

.sw{position:relative;width:52px;height:30px;border-radius:99px;background:#d4dce2;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--red)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}

.row2 .tile{min-height:96px;flex-direction:row;gap:12px;font-size:15px}
.row2 .ico{font-size:28px}

.cfg{display:none;margin-top:14px;background:#fff;border-radius:22px;padding:18px;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600;font-size:14px}
.cfg.open{display:flex}
.cfg input{flex:1;min-width:220px;border:1.5px solid #dbe5ea;border-radius:12px;padding:10px 12px;font-weight:400}
.btn{border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;background:var(--blue);color:#fff}

.rep{display:none;margin-top:14px;background:#fff;border-radius:22px;padding:18px;overflow-x:auto;box-shadow:0 6px 18px #4a7a8018}
.rep.open{display:block}
.rep h2{font-size:16px;margin-bottom:4px}
.rep .sum{color:var(--muted);font-size:13px;margin-bottom:12px}
.rep table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.rep th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px}
.rep td{padding:10px;border-top:1px solid #edf1f4}
.rep tr:nth-child(even) td{background:#f3f9fb}
.tag{display:inline-block;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:600}
.tag.ok{background:#e1f6ec;color:#1b8a5a}
.tag.bad{background:#ffe4e7;color:#d12f40}
.tag.in{background:#e6eef2;color:var(--muted)}
.tile.sel{outline:3px solid var(--blue)}
@media (max-width:860px){
  body{padding:12px}
  .grid{grid-template-columns:1fr}
  .cam{order:-1}
  .power{min-height:150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="main">
  <div class="top">
    <h1>Monitor de Laboratorio</h1>
    <span class="pill" id="status">Sistema activo</span>
  </div>

  <section class="grid">
    <button class="tile power" id="power" onclick="togglePower()" aria-pressed="true">
      <span class="ico">⏻</span><span id="powerLbl">ON</span>
    </button>

    <div class="cam" id="cam">
      <img id="camImg" alt="Transmisión en vivo" hidden>
      <div class="ph" id="camPh"><span>🎥</span>Transmisión en vivo<br>Conecta aquí tu cámara en Ajustes</div>
      <div class="count">👤 <span id="people">0</span></div>
      <div class="warn">⚠️</div>
    </div>

    <div class="tile">
      <span>MODO ALERTA</span><span class="ico">🚨</span>
      <button class="sw" id="alertSw" role="switch" aria-checked="false" aria-label="Modo alerta" onclick="toggleAlert()"></button>
    </div>
  </section>

  <section class="grid row2">
    <button class="tile" id="btnLab" onclick="showRep(false)"><span class="ico">🏠</span>LABORATORIO</button>
    <button class="tile" id="btnRep" onclick="showRep(!$('rep').classList.contains('open'))"><span class="ico">⚠️</span>REPORTES</button>
    <button class="tile" onclick="toggleCfg()"><span class="ico">⚙️</span>AJUSTES</button>
  </section>

  <section class="cfg" id="cfg">
    <label for="camUrl">URL de la cámara</label>
    <input id="camUrl" placeholder="http://192.168.1.50:81/stream">
    <button class="btn" onclick="setCam($('camUrl').value.trim())">Guardar</button>
  </section>

  <section class="rep" id="rep">
    <h2>Reportes</h2>
    <p class="sum" id="repSum"></p>
    <table>
      <thead><tr><th>Persona</th><th>Hora de entrada</th><th>Hora de salida</th><th>Estado</th></tr></thead>
      <tbody id="repRows"></tbody>
    </table>
  </section>
</main>

<script>

const DEFAULT_CAM_URL = "";
const $ = id => document.getElementById(id);

let on = false;
let alertOn = false;
let busy = false;

async function api(url, options = {}) {
    const respuesta = await fetch(url, {
        cache: "no-store",
        ...options
    });

    if (!respuesta.ok) {
        throw new Error("Error HTTP " + respuesta.status);
    }

    return await respuesta.json();
}

function setStatus() {
    const s = $("status");

    s.className = "pill" +
        (!on ? " off" : alertOn ? " alert" : "");

    s.textContent = !on
        ? "Sistema apagado"
        : alertOn ? "Modo alerta" : "Sistema activo";

    $("power").classList.toggle("off", !on);
    $("power").setAttribute("aria-pressed", on);
    $("powerLbl").textContent = on ? "ON" : "OFF";

    $("alertSw").setAttribute("aria-checked", alertOn);
    $("cam").classList.toggle("dim", !on);
    $("cam").classList.toggle("alert", on && alertOn);
    $("alertSw").disabled = !on || busy;
    $("power").disabled = busy;
}

async function cargarEstado() {
    if (busy) return;

    const datos = await api("/api/estado");

    if (busy) return;

    on = datos.activo;
    alertOn = datos.alerta;

    setStatus();
}

async function guardarEstado(activo, alerta) {
    if (busy) return;

    busy = true;
    setStatus();

    try {
        await api("/api/estado", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                activo: activo,
                alerta: alerta
            })
        });

        on = activo;
        alertOn = alerta;

    } catch (error) {
        console.error(error);
        alert("No se pudo actualizar el sistema.");
    } finally {
        busy = false;
        setStatus();
    }
}

function togglePower() {
    guardarEstado(!on, false);
}

function toggleAlert() {
    if (!on) return;
    guardarEstado(on, !alertOn);
}

function setPeople(n) {
    $("people").textContent = n;
}

async function cargarPersonas() {
    const datos = await api("/api/en-laboratorio");
    setPeople(datos.length);
}

function setCam(url) {
    const img = $("camImg");

    if (!url) {
        img.removeAttribute("src");
        img.hidden = true;
        $("camPh").style.display = "flex";
        return;
    }

    img.onload = () => {
        img.hidden = false;
        $("camPh").style.display = "none";
    };

    img.onerror = () => {
        img.hidden = true;
        $("camPh").style.display = "flex";
        $("camPh").textContent =
            "No se pudo conectar con la cámara.";
    };

    img.src = url;
    localStorage.setItem("camUrl", url);
}

function toggleCfg() {
    $("cfg").classList.toggle("open");
}

function formatoFecha(valor) {
    if (!valor) return "";
    return new Date(valor).toLocaleString("es-MX");
}

function agregarFila(valores) {
    const fila = document.createElement("tr");

    valores.forEach(valor => {
        const celda = document.createElement("td");
        celda.textContent = valor;
        fila.appendChild(celda);
    });

    $("repRows").appendChild(fila);
}

async function cargarReportes() {
    const [historial, reportes] = await Promise.all([
        api("/api/historial"),
        api("/api/reportes")
    ]);

    $("repRows").replaceChildren();

    $("repSum").textContent =
        historial.length + " accesos y " +
        reportes.length + " incidencias";

    historial.forEach(r => {
        agregarFila([
            r.nombre,
            formatoFecha(r.entrada),
            r.salida
                ? formatoFecha(r.salida)
                : "Sigue dentro",
            r.salida ? "Salida registrada" : "Dentro"
        ]);
    });

    reportes.forEach(r => {
        agregarFila([
            "Incidencia",
            formatoFecha(r.creado),
            "-",
            r.descripcion
        ]);
    });

    if (!historial.length && !reportes.length) {
        agregarFila(["Sin registros", "-", "-", "-"]);
    }
}

function showRep(open) {
    $("rep").classList.toggle("open", open);
    $("btnRep").classList.toggle("sel", open);
    $("btnLab").classList.toggle("sel", !open);

    if (open) {
        cargarReportes().catch(console.error);

        $("rep").scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });
    }
}

async function actualizar() {
    try {
        await Promise.all([
            cargarEstado(),
            cargarPersonas()
        ]);

        if ($("rep").classList.contains("open")) {
            await cargarReportes();
        }

    } catch (error) {
        console.error(error);
        $("status").textContent = "Sin conexión";
    }
}

const camUrl =
    localStorage.getItem("camUrl") || DEFAULT_CAM_URL;

$("camUrl").value = camUrl;
setCam(camUrl);
setStatus();
showRep(false);
actualizar();

setInterval(actualizar, 3000);
</script>
</body>
</html>
